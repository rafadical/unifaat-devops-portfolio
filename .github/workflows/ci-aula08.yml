name: CI Pipeline — Aula 08

on:
  push:
    branches: [main]
    paths:
      - 'aula-08/technova-api/**'
      - '.github/workflows/ci-aula08.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aula-08/technova-api/**'
      - '.github/workflows/ci-aula08.yml'
  workflow_dispatch:

# B4: um push novo na mesma branch cancela a execução anterior
concurrency:
  group: ci-aula08-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: aula-08/technova-api

env:
  # R5: secret do repositório (valor fictício; o GitHub mascara nos logs)
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (com cache do npm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-08/technova-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  test:
    name: Testes (Jest) — Node ${{ matrix.node }}
    needs: lint
    runs-on: ubuntu-latest
    # B1: matrix com Node 18 e 20
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }} (com cache do npm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: aula-08/technova-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com coverage
        run: npm test -- --ci
        env:
          NODE_ENV: test

      - name: Publicar relatório de coverage
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: aula-08/technova-api/coverage/
          retention-days: 7

  build:
    name: Build Docker + Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Usar o secret AWS_REGION (aparece mascarado no log)
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "Secret AWS_REGION nao configurado" && exit 1
          fi
          echo "Regiao configurada via secret: $AWS_REGION"

      - name: Docker build (tag = SHA do commit)
        run: docker build -t technova-api:${{ github.sha }} -t technova-api:latest .

      # B5: sobe o container, testa o /health e remove
      - name: Smoke test do container
        run: |
          docker run -d --name technova-smoke -p 3000:3000 technova-api:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo ""
              echo "Smoke test OK na tentativa $i"
              break
            fi
            if [ "$i" = "15" ]; then
              docker logs technova-smoke
              exit 1
            fi
            sleep 2
          done

      - name: Remover container do smoke test
        if: always()
        run: docker rm -f technova-smoke || true

      - name: Listar imagem gerada
        run: docker images technova-api

  # B3: comenta o resultado do CI no Pull Request
  pr-comment:
    name: Comentar resultado no PR
    needs: [lint, test, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comentar no PR
        uses: actions/github-script@v7
        with:
          script: |
            const icon = (r) => ({ success: '✅', failure: '❌', cancelled: '⚪', skipped: '⏭️' }[r] || r);
            const body = [
              '### Resultado do CI — Aula 08',
              '',
              '| Job | Resultado |',
              '|---|---|',
              `| Lint (ESLint) | ${icon('${{ needs.lint.result }}')} |`,
              `| Testes (Jest, Node 18 e 20) | ${icon('${{ needs.test.result }}')} |`,
              `| Build Docker + Smoke Test | ${icon('${{ needs.build.result }}')} |`,
              '',
              `[Ver execução](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · commit \`${context.sha.substring(0, 7)}\``
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
